name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  privacy-gate:
    name: Privacy gate (tree, filenames, commit messages)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gate self-test (planted term must fail)
        run: python scripts/ci/test_privacy_gate.py

      - name: Scan
        env:
          PRIVACY_GATE_KEY: ${{ secrets.PRIVACY_GATE_KEY }}
          # The secret is absent on fork PRs; require it wherever it exists.
          PRIVACY_GATE_REQUIRE_KEY: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '0' }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          RANGE=""
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/${BASE_REF}..${HEAD_SHA}"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${GITHUB_SHA}"
          fi
          if [ -n "$RANGE" ]; then python scripts/ci/privacy-gate.py --range "$RANGE"; else python scripts/ci/privacy-gate.py; fi
